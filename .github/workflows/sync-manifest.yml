name: Keep tracked-source SHA256 manifest current
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: csdr-manifest-sync-main
  cancel-in-progress: false
jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild the source manifest
        run: |
          python scripts/source_manifest.py --write
          python scripts/source_manifest.py --check
      - name: Commit manifest only if source hashes have changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize source SHA256 manifest with tracked files'
            git push origin HEAD:main
          fi
