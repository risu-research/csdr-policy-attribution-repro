name: Unit tests (no network)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned parser
        run: python -m pip install -r requirements.txt
      - name: Test manifests, parsing, corruption rejection
        run: python -m unittest discover -s tests -v
      - name: Verify manifest positions (no original data download)
        run: python reproduce.py manifest
